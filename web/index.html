<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animoo</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.3/lib/three-vrm.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <header class="card topbar">
    <h1>Animoo</h1>
    <nav class="tabs" role="tablist">
      <a href="#chat" role="tab" data-page="chat">Chat</a>
      <a href="#movie" role="tab" data-page="movie">Movie</a>
    </nav>
    <span id="status" class="pill">checking backend…</span>
  </header>

  <section id="page-chat" class="page" hidden>
    <div id="chat-cover" class="chat-cover"><span>setting the scene…</span></div>
    <aside class="card chat-panel">
      <div class="chat-head">
        <span class="panel-title">Talk with Milo</span>
        <span id="chat-status" class="pill">…</span>
      </div>
      <ol id="chat-log" class="chat-log"></ol>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-input" type="text" placeholder="Ask something, or “show me …”" spellcheck="false">
        <button id="chat-send" type="submit" class="primary">Send</button>
      </form>
      <div class="chat-foot">
        <label>voice <select id="chat-voice"></select></label>
        <span id="chat-brain">brain: …</span>
      </div>
    </aside>
  </section>

  <section id="page-movie" class="page" hidden>
    <aside class="card movie-panel">
      <label for="movie-prompt" class="panel-title">Describe a scene</label>
      <textarea id="movie-prompt" rows="4" spellcheck="false"></textarea>
      <button id="movie-make" type="button" class="primary">Make movie</button>
      <button id="movie-new" type="button" hidden>New scene</button>
      <div class="panel-title">Agents</div>
      <ol id="movie-log" class="agent-log"></ol>
      <details id="movie-script-box" hidden>
        <summary>scene script (JSON)</summary>
        <pre id="movie-script"></pre>
      </details>
    </aside>
    <div id="movie-timeline" class="card timeline"></div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
