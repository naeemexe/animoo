<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animo World · characters</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.3/lib/three-vrm.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <header class="card">
    <h1>Characters</h1>
    <span id="status" class="pill">loading…</span>
  </header>
  <div id="transport" class="card transport">
    <button id="play" type="button">Pause</button>
    <input id="scrub" type="range" min="0" max="1" step="0.001" value="0">
    <span id="time" class="pill">0.00 s</span>
    <span id="segment" class="pill"></span>
    <label><input id="ik" type="checkbox" checked> foot IK</label>
    <label><input id="marks" type="checkbox"> foot targets</label>
  </div>
  <script type="module" src="js/characters-page.js"></script>
</body>
</html>
